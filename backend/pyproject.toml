[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-harbor"
version = "0.1.0"
description = "Real genomic evidence investigations with durable, evaluated harness adaptation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2,<3",
  "pymongo>=4.12,<4.19", "langgraph>=1,<2", "langgraph-checkpoint-mongodb==0.5.0",
  "openai>=1.60", "python-dotenv>=1,<2", "httpx>=0.28,<1",
  "openpyxl>=3.1,<4", "pandas>=2.2,<3", "bioframe>=0.8,<1", "requests>=2.32,<3"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["safe_harbor*"]
